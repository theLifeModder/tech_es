[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "teches_init"
version = "0.1.0"
description = "Bootstrap and initialize TechES project infrastructure."
requires-python = ">=3.10"
dependencies = ["click>=8.0"]

[project.scripts]
teches = "teches_init.cli:cli"

[tool.setuptools]
packages = ["teches_init"]
package-dir = { "" = "src" }
