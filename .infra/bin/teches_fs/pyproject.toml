[project]
name = "teches_fs"
version = "1.0.0"
description = "Automated out-of-the-box CLI helper for Node.js file system actions."
dependencies = [
    "click>=8.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[project.entry-points."teches.commands"]
fs = "teches_fs.cli:fs_command"

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"
